name: Publish Moonplan website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static pages
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://serg-rgb.github.io/moonplan-site' }}
          INDEX_SITE: ${{ vars.INDEX_SITE || 'false' }}
        run: |
          if [ "$INDEX_SITE" = "true" ]; then
            python3 build.py --url "$SITE_URL"
          else
            python3 build.py --url "$SITE_URL" --preview
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
